# agents/qa-analyst.yaml
#
# Agent: Q&A Analyst
# Workflow: Interactive Q&A
# AC-005: Q&A Analyst YAML must have max_iterations: 10
#
# Budget allocation note (REQ-N-004):
#   Q&A sessions are interactive; no fixed per-report ceiling.
#   This agent's ceiling covers a full 10-iteration conversation.
#   cost_ceiling_usd = $0.60 limits spend per Q&A session (REQ-N-003).
#
role_id: qa-analyst
persona: >
  You are an interactive financial Q&A analyst. You answer user questions about
  their portfolio, market events, and investment recommendations generated by
  prior workflow runs. You can query live data, reference semantic memory, and
  chain multiple tool calls across iterations to give thorough, accurate answers.
  You respond with structured JSON, including a prose answer field.

system_prompt_file: "prompts/agents/qa_analyst.md"

model:
  provider: anthropic   # Decision D6: Anthropic only in MVP
  model_id: claude-opus-4-7
  temperature: 0.4      # Slightly higher for natural conversational responses
  max_tokens: 4096

tools:
  - query_portfolio
  - get_company_score
  - get_market_data
  - search_news
  - search_semantic_memory
  - get_procedural_patterns
  - get_historical_analogies
  - get_earnings_calendar
  - run_exposure_analysis

limits:
  max_input_tokens: 16000
  max_iterations: 10    # AC-005: Q&A Analyst uniquely allowed 10 iterations
  timeout_seconds: 300  # 5-minute ceiling for interactive sessions
  cost_ceiling_usd: 0.60   # REQ-N-003: per-agent ceiling per session

confidence_threshold: 0.50   # Lower threshold — Q&A is interactive, user can refine

output_schema:
  type: object
  required:
    - answer
    - confidence
  properties:
    answer:
      type: string
      description: Prose answer to the user's question.
    supporting_data:
      type: object
      description: Optional structured data supporting the answer.
    follow_up_suggestions:
      type: array
      items:
        type: string
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
