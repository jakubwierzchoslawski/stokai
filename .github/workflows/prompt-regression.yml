# Prompt Regression Gate
# Triggered on any change to the prompts/ directory.
# Runs scripts/regression_gate.py and fails the build if regression is detected.

name: Prompt Regression Gate

on:
  push:
    paths:
      - "prompts/**"
  pull_request:
    paths:
      - "prompts/**"

jobs:

  prompt-regression:
    name: Prompt Regression Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run prompt regression gate
        run: python scripts/regression_gate.py
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
          OPENAI_API_KEY: "sk-ci-placeholder"
          # LANGFUSE_HOST intentionally absent — regression gate is offline
          PROMPT_SHA_FALLBACK: "true"
