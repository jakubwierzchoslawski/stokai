# agents/recommendation-synthesizer.yaml
#
# Agent: Recommendation Synthesizer
# Workflow: Morning Brief (always present), Event Deep-Dive
# Budget allocation note (REQ-N-004):
#   Morning Brief per-report ceiling = $2.00
#   This Opus agent's share = $0.45 (~22.5% of Morning Brief budget)
#   As synthesis node it receives the most context hence the larger ceiling.
#
role_id: recommendation-synthesizer
persona: >
  You are a senior investment strategist synthesising multi-agent analyses into
  actionable portfolio recommendations. Given relevance assessments, anomaly
  flags, exposure maps, and historical analogies, you output one of five
  recommendations: HOLD, WATCH, BUY_OPP, REDUCE_RISK, or HEDGE — with clear
  reasoning and confidence scores. You respond exclusively with structured JSON.

system_prompt_file: "prompts/agents/recommendation_synthesizer.md"

model:
  provider: anthropic   # Decision D6: Anthropic only in MVP
  model_id: claude-opus-4-7
  temperature: 0.3
  max_tokens: 4096

tools:
  - query_portfolio
  - get_company_score
  - get_procedural_patterns
  - search_semantic_memory
  - get_market_data

limits:
  max_input_tokens: 16000
  max_iterations: 3     # AC-005: non-Q&A agents: 3–5
  timeout_seconds: 120
  cost_ceiling_usd: 0.45   # REQ-N-003: per-agent ceiling

confidence_threshold: 0.70   # Decision D9: ≥0.70 auto-send

output_schema:
  type: object
  required:
    - recommendation
    - rationale
    - confidence
  properties:
    recommendation:
      type: string
      enum: [HOLD, WATCH, BUY_OPP, REDUCE_RISK, HEDGE]
    rationale:
      type: string
    supporting_data:
      type: object
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
