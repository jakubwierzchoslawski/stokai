[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stokai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "redis[asyncio]>=5.0.0",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.9",
    "langgraph>=1.2.0",
    "langgraph-checkpoint-postgres>=3.0.0",
    "langchain-core>=1.0.0",
    "celery[redis]>=5.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "anyio>=4.4.0",
    "httpx>=0.27.0",
    "freezegun>=1.5.0",
    "aiosqlite>=0.20.0",
    "bandit>=1.8,<2.0",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: marks tests that require live Redis and PostgreSQL (deselect with '-m not integration')",
    "smoke: marks smoke tests that require Docker Engine (run with: pytest -m smoke)",
    "performance: Mode A latency SLA assertions (deselect with -m 'not performance')",
]
addopts = "-m 'not performance'"

[tool.coverage.run]
source = ["src"]
omit = ["*/migrations/*", "*/alembic/*"]

[tool.bandit]
targets = ["src"]
tests = ["B105", "B106", "B107"]
skips = []
