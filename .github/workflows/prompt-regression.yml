# Prompt Regression Gate — PLAN-F-014 TASK-003 (AC-001)
#
# Triggered on pull_request when any file under prompts/** is changed.
# For each changed prompt file, extracts the role_id from the filename and runs
# src.ai.prompts.ci.regression_gate via the Tier 2 regression runner.
#
# If RegressionReport.passed is False (any metric degrades > 5%), the step
# exits with code 1 and hard-blocks the PR from merging. There is no override.
#
# REQ-N-009: >5% degradation on any single metric is a hard block.

name: Prompt Regression Gate

on:
  pull_request:
    paths:
      - "prompts/**"

jobs:

  prompt-regression:
    name: Tier 2 Regression Gate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history needed for git diff and blob SHAs

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Detect changed prompt files
        id: changed-prompts
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"
          CHANGED=$(git diff --name-only "${BASE_SHA}...${HEAD_SHA}" -- 'prompts/**/*.md' | tr '\n' ' ')
          echo "changed_files=${CHANGED}" >> $GITHUB_OUTPUT
          echo "Changed prompt files: ${CHANGED}"

      - name: Run Tier 2 regression gate for each changed prompt
        if: steps.changed-prompts.outputs.changed_files != ''
        run: |
          set -euo pipefail
          CHANGED="${{ steps.changed-prompts.outputs.changed_files }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"

          EXIT_CODE=0
          for FILE in $CHANGED; do
            # Extract role_id from filename (strip path and .md extension)
            ROLE_ID=$(basename "${FILE}" .md)
            echo "--- Running regression gate for role_id=${ROLE_ID} ---"

            # Compute blob SHAs for candidate (HEAD) and production (BASE)
            CANDIDATE_SHA=$(git hash-object "${FILE}" 2>/dev/null || echo "unknown")
            PRODUCTION_SHA=$(git show "${BASE_SHA}:${FILE}" 2>/dev/null | git hash-object --stdin 2>/dev/null || echo "unknown")

            python -m src.ai.prompts.ci.regression_gate \
              --role-id "${ROLE_ID}" \
              --candidate-sha "${CANDIDATE_SHA}" \
              --production-sha "${PRODUCTION_SHA}" \
              --step-summary "${GITHUB_STEP_SUMMARY}" \
              || EXIT_CODE=1
          done
          exit ${EXIT_CODE}
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
          OPENAI_API_KEY: "sk-ci-placeholder"
          JWT_SECRET_KEY: "ci-placeholder-secret-key-32chars!!"
          JWT_REFRESH_SECRET_KEY: "ci-placeholder-refresh-key-32char"
          REDIS_URL: "redis://localhost:6379/0"
          # LANGFUSE_HOST intentionally absent — regression gate runs offline
          PROMPT_SHA_FALLBACK: "true"

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-regression-report
          path: ${{ github.step_summary }}
          if-no-files-found: ignore

      # PLAN-N-009 TASK-003: Performance gate — ensures regression run completes
      # in under 5 minutes (AC-004).
      #
      # Exit codes from perf_gate.py:
      #   0 — regression passed AND elapsed <= 300 s
      #   1 — regression failed (metric breach)
      #   2 — regression passed BUT elapsed > 300 s  (timing warning only)
      #
      # continue-on-error: true for exit code 2 — the step surfaces a timing
      # warning without hard-blocking the PR.  This behaviour is intentional
      # for the first two sprints while timing baselines are collected.  It
      # will be changed to a hard block once baseline data is established.
      - name: prompt-regression-perf-check
        if: steps.changed-prompts.outputs.changed_files != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          CHANGED="${{ steps.changed-prompts.outputs.changed_files }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.sha }}"

          for FILE in $CHANGED; do
            ROLE_ID=$(basename "${FILE}" .md)
            CANDIDATE_SHA=$(git hash-object "${FILE}" 2>/dev/null || echo "unknown")
            PRODUCTION_SHA=$(git show "${BASE_SHA}:${FILE}" 2>/dev/null | git hash-object --stdin 2>/dev/null || echo "unknown")

            echo "--- perf-check role_id=${ROLE_ID} ---"
            python -m src.ai.evaluation.ci.perf_gate \
              --role-id "${ROLE_ID}" \
              --candidate-sha "${CANDIDATE_SHA}" \
              --production-sha "${PRODUCTION_SHA}" \
              --max-seconds 300 \
              | tee "perf_timing_${ROLE_ID}.json"
          done
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          ANTHROPIC_API_KEY: "sk-ant-ci-placeholder"
          OPENAI_API_KEY: "sk-ci-placeholder"
          JWT_SECRET_KEY: "ci-placeholder-secret-key-32chars!!"
          JWT_REFRESH_SECRET_KEY: "ci-placeholder-refresh-key-32char"
          REDIS_URL: "redis://localhost:6379/0"
          PROMPT_SHA_FALLBACK: "true"

      - name: Upload perf-gate timing artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prompt-regression-perf-timing
          path: perf_timing_*.json
          if-no-files-found: ignore
