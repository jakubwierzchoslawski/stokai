# Local development overrides — merged automatically by Docker Compose.
# DO NOT commit with production credentials.
# This file enables hot-reload and exposes service ports for local tools.
#
# Usage: docker compose up  (override is applied automatically)
# Production: docker compose -f docker-compose.yml up  (skips this file)

services:

  # Source mount enables hot-reload for all application containers
  api:
    volumes:
      - ./:/app
    environment:
      DEBUG: "true"
      LOG_LEVEL: "DEBUG"

  worker:
    volumes:
      - ./:/app

  beat:
    volumes:
      - ./:/app

  # Expose data store ports for local tooling (psql, redis-cli, DBeaver, etc.)
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  # Expose Langfuse UI on host port 3000 and enable debug mode for local dev
  langfuse-server:
    ports:
      - "${LANGFUSE_PORT:-3000}:3000"
    environment:
      LANGFUSE_DEBUG: "true"
