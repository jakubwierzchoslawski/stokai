# StokAI CI Pipeline
# Runs on push to main and on every pull request.
#
# Jobs:
#   1. lint             — ruff check + format
#   2. test-unit        — pytest (unit tests only, no Docker)
#   3. azure-import-scan— AST scan for Azure SDK imports in src/
#   4. compose-smoke    — docker compose up health check (requires Docker secrets)
#
# IMPORTANT: compose-smoke requires the following GitHub Actions secrets to be set:
#   DATABASE_URL, REDIS_URL, ANTHROPIC_API_KEY, OPENAI_API_KEY,
#   JWT_SECRET_KEY, JWT_REFRESH_SECRET_KEY,
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB,
#   LANGFUSE_DB_USER, LANGFUSE_DB_PASSWORD, LANGFUSE_DB_NAME,
#   LANGFUSE_SECRET_KEY, LANGFUSE_PUBLIC_KEY

name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff>=0.4.0

      - name: ruff check
        run: ruff check src/ tests/

      - name: ruff format check
        run: ruff format --check src/ tests/

  # ── 2. Unit tests ────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run unit tests
        run: pytest tests/ -v --ignore=tests/integration
        env:
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/test"
          REDIS_URL: "redis://localhost:6379/0"
          ANTHROPIC_API_KEY: "sk-ant-ci-test"
          OPENAI_API_KEY: "sk-ci-test"
          JWT_SECRET_KEY: "ci-secret-key-at-least-32-chars-long"
          JWT_REFRESH_SECRET_KEY: "ci-refresh-secret-key-at-least-32-chars"

  # ── 3. Azure import scan ─────────────────────────────────────────────────────
  azure-import-scan:
    name: Azure SDK Import Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Scan src/ for Azure SDK imports
        run: pytest tests/test_azure_import_scan.py -v

  # ── 4. Compose smoke test ────────────────────────────────────────────────────
  compose-smoke:
    name: Compose Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test-unit, azure-import-scan]
    # Skip smoke test if running without required secrets
    # Set env vars from GitHub Actions secrets
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql+asyncpg://stokai:smoketest@postgres:5432/stokai' }}
      REDIS_URL: ${{ secrets.REDIS_URL || 'redis://redis:6379/0' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-smoke-placeholder' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-smoke-placeholder' }}
      JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY || 'smoke-test-jwt-secret-key-long-enough' }}
      JWT_REFRESH_SECRET_KEY: ${{ secrets.JWT_REFRESH_SECRET_KEY || 'smoke-test-refresh-secret-long-enough' }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER || 'stokai' }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'smoketest' }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB || 'stokai' }}
      LANGFUSE_DB_USER: ${{ secrets.LANGFUSE_DB_USER || 'langfuse' }}
      LANGFUSE_DB_PASSWORD: ${{ secrets.LANGFUSE_DB_PASSWORD || 'smoketest' }}
      LANGFUSE_DB_NAME: ${{ secrets.LANGFUSE_DB_NAME || 'langfuse' }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY || 'smoke-langfuse-secret' }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY || 'smoke-langfuse-public' }}
    steps:
      - uses: actions/checkout@v4

      - name: Write .env file for compose
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
          OPENAI_API_KEY=${OPENAI_API_KEY}
          JWT_SECRET_KEY=${JWT_SECRET_KEY}
          JWT_REFRESH_SECRET_KEY=${JWT_REFRESH_SECRET_KEY}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          LANGFUSE_DB_USER=${LANGFUSE_DB_USER}
          LANGFUSE_DB_PASSWORD=${LANGFUSE_DB_PASSWORD}
          LANGFUSE_DB_NAME=${LANGFUSE_DB_NAME}
          LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
          LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
          EOF
          # Expand variables
          envsubst < .env > .env.expanded && mv .env.expanded .env

      - name: Start stack (production compose only — no override)
        run: >
          docker compose
          -f docker-compose.yml
          up -d --wait --timeout 120

      - name: Health check API
        run: |
          for i in $(seq 1 10); do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health)
            if [ "$status" = "200" ]; then
              echo "Health check passed (HTTP $status)"
              exit 0
            fi
            echo "Attempt $i: got HTTP $status, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 10 attempts"
          docker compose logs api
          exit 1

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml down -v
