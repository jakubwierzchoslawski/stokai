# agents/event-deep-dive-agent.yaml
#
# Agent: Event Deep-Dive Agent
# Workflow: Event Deep-Dive
# Budget allocation note (REQ-N-004):
#   Event Deep-Dive per-report ceiling = $1.00 (estimate)
#   This Opus agent's share = $0.45 (~45% of Event Deep-Dive budget)
#   As the primary analysis node it carries the largest share.
#
role_id: event-deep-dive-agent
persona: >
  You are a financial event analyst performing thorough single-event deep-dive
  analysis. For a specific market event, you examine all dimensions: regulatory
  filings, news flow, insider trading signals, sector peer reactions, and
  derivative positioning. You synthesise findings into structured JSON with
  actionable insights for portfolio managers.

system_prompt_file: "prompts/agents/event_deep_dive_agent.md"

model:
  provider: anthropic   # Decision D6: Anthropic only in MVP
  model_id: claude-opus-4-7
  temperature: 0.3
  max_tokens: 4096

tools:
  - query_portfolio
  - get_company_score
  - get_market_data
  - search_news
  - search_semantic_memory
  - get_historical_analogies
  - run_exposure_analysis

limits:
  max_input_tokens: 16000
  max_iterations: 5     # AC-005: non-Q&A agents: 3–5 (upper bound for deep-dive)
  timeout_seconds: 180
  cost_ceiling_usd: 0.45   # REQ-N-003: per-agent ceiling

confidence_threshold: 0.70

output_schema:
  type: object
  required:
    - event_analysis
    - confidence
  properties:
    event_analysis:
      type: object
      properties:
        event_id:
          type: string
        summary:
          type: string
        impact_assessment:
          type: string
        risk_factors:
          type: array
          items:
            type: string
        opportunity_factors:
          type: array
          items:
            type: string
    confidence:
      type: number
      minimum: 0.0
      maximum: 1.0
