# Morning Brief Workflow — per-workflow configuration
#
# Controls cost ceiling, execution timeouts, cron schedule, HIL deadline,
# and the ordered agent node list.
#
# PLAN-F-006 TASK-002

workflow_id: morning_brief
display_name: "Morning Brief"

# ── Budget (REQ-N-004) ────────────────────────────────────────────────────────
cost_ceiling_usd: 2.00

# ── Timing (REQ-N-002) ────────────────────────────────────────────────────────
timeout_seconds: 600          # 10-minute hard cap
target_duration_seconds: 300  # 5-minute soft target

# ── Scheduling ────────────────────────────────────────────────────────────────
cron_schedule: "30 5 * * *"   # fire at 05:30 UTC daily

# ── HIL deadline (§7.6) ──────────────────────────────────────────────────────
hil_deadline: "05:45"         # UTC; unreviewed items timed-out by hil_timeout_handler

# ── Default user dispatch time (D7) ──────────────────────────────────────────
default_send_time: "06:00"    # overridden per user by user.settings.dispatch_time

# ── Ordered agent nodes ───────────────────────────────────────────────────────
# DeterministicNodes are omitted from this list; only AgentNodes listed here.
# evaluate_quality is always second-to-last; narrative_writer always last.
nodes:
  - relevance_analyst
  - anomaly_detector
  - historical_context_agent
  - recommendation_synthesizer
  - evaluate_quality          # always second-to-last (§7.5, §7.7)
  - narrative_writer          # always last AgentNode (§7.2)

# ── Per-agent token budget overrides (applied at 80% cost ceiling) ───────────
reduced_token_budget_factor: 0.5  # halve remaining agents' token budgets at 80%
