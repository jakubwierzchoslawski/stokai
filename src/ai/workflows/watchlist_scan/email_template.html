<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Afternoon Watchlist Scan</title>
  <style>
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      font-size: 16px;
      line-height: 1.6;
      color: #1a1a1a;
      background-color: #ffffff;
      max-width: 680px;
      margin: 0 auto;
      padding: 24px 16px;
    }
    .header {
      border-bottom: 2px solid #c0392b;
      padding-bottom: 16px;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 22px;
      font-weight: bold;
      color: #1a1a1a;
      margin: 0 0 4px 0;
    }
    .header .dateline {
      font-size: 13px;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .section-title {
      font-size: 13px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #c0392b;
      margin-top: 28px;
      margin-bottom: 8px;
    }
    .report-body {
      font-size: 15px;
      color: #1a1a1a;
    }
    .recommendation-item {
      border-left: 3px solid #c0392b;
      padding-left: 12px;
      margin-bottom: 16px;
    }
    .recommendation-item .action-signal {
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .confidence-badge {
      display: inline-block;
      font-size: 11px;
      background: #f5f5f5;
      border: 1px solid #ddd;
      padding: 2px 8px;
      border-radius: 3px;
      color: #555;
    }
    .footer {
      border-top: 1px solid #e0e0e0;
      margin-top: 32px;
      padding-top: 16px;
      font-size: 12px;
      color: #888;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Afternoon Watchlist Scan</h1>
    <div class="dateline">StokAI &middot; {{dispatch_date}} &middot; 18:00 UTC Edition</div>
  </div>

  <div class="report-body">
    {{report_content}}
  </div>

  <div class="footer">
    <p>
      This report was generated by StokAI's automated watchlist scan workflow.
      Confidence score: <span class="confidence-badge">{{overall_confidence}}</span>
    </p>
    <p>
      &copy; StokAI &mdash; For informational purposes only. Not financial advice.
    </p>
  </div>
</body>
</html>
