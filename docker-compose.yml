---
# StokAI — full eight-service stack
# All credentials and URLs are read from .env via ${VAR} interpolation.
# No hardcoded IPs, secrets, or connection strings.
# Copy .env.example to .env and fill in REPLACE_ME values before running.

services:

  # ── Data stores ─────────────────────────────────────────────────────────────

  postgres:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - stokai-net
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - stokai-net
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${LANGFUSE_DB_USER}
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: ${LANGFUSE_DB_NAME}
    volumes:
      - langfuse-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${LANGFUSE_DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - stokai-net
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:8123/ping -O- || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - stokai-net
    restart: unless-stopped

  # ── Observability ────────────────────────────────────────────────────────────

  langfuse-server:
    image: langfuse/langfuse:latest
    depends_on:
      langfuse-db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL}
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL}
      SALT: ${LANGFUSE_SECRET_KEY}
    ports:
      - "3000:3000"
    networks:
      - stokai-net
    restart: unless-stopped

  # ── Application tier ─────────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: stokai-app
    command: uvicorn src.main:app --host 0.0.0.0 --port ${PORT:-8000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:${PORT:-8000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 http://localhost:${PORT:-8000}/health -O- || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - stokai-net
    restart: unless-stopped

  worker:
    image: stokai-app
    command: celery -A src.config.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - stokai-net
    restart: unless-stopped

  beat:
    image: stokai-app
    command: >
      celery -A src.config.celery_app beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
    depends_on:
      - worker
    env_file:
      - .env
    volumes:
      - beat-data:/app/celerybeat-schedule
    networks:
      - stokai-net
    restart: unless-stopped

# ── Named volumes ────────────────────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  langfuse-db-data:
  clickhouse-data:
  beat-data:

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  stokai-net:
    driver: bridge
